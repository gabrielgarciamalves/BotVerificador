name: Verificação Semanal

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: 

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas
      run: pip install -r requirements.txt

    - name: Rodar a verificação
      run: python main.py

    - name: Salvar o histórico
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add historico.json
        git commit -m "Atualiza historico.json" || echo "Nenhuma alteração no histórico"
        git push
